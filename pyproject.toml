[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subgen-cli"
version = "0.4.3"
description = "Interactive subtitle transcription, translation, and burn-in CLI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.160",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "keyring>=25.5",
    "numpy>=1.26",
    "psutil>=6.0",
    "scipy>=1.11",
    "segno>=1.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
align = [
    "faster-whisper>=1.1",
    "sentencepiece>=0.2",
    # Keep the frozen Windows runtime on the version verified with WhisperX.
    # Unbounded minor upgrades previously produced an installer whose lazy
    # Wav2Vec2 import failed even though the source module was present.
    "transformers==4.57.3",
    "whisperx>=3.3",
]
desktop-build = ["pyinstaller>=6.10"]
cloud = [
    "boto3>=1.35",
    "cryptography>=43",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "PyJWT[crypto]>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]
cloud-test = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[project.scripts]
SubGen = "subgen_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "cloud"]

[tool.setuptools]
py-modules = ["subgen_acoustic", "subgen_cli", "subgen_db", "subgen_drive", "subgen_editor", "subgen_longform", "subgen_mobile", "subgen_paths", "subgen_pipeline", "subgen_planner", "subgen_providers", "subgen_review", "subgen_transcription", "subgen_transcription_adapters", "subgen_utils", "subgen_version"]

[tool.setuptools.packages.find]
where = ["cloud"]
include = ["subgen_cloud*"]
