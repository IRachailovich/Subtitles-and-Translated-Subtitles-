<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting SubGen</title>
    <style>
        :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #080b13; color: #f8fafc; }
        main { width: min(420px, calc(100% - 48px)); text-align: center; }
        .mark { width: 56px; height: 56px; display: block; margin: 0 auto 18px; border-radius: 50%; object-fit: cover; border: 1px solid #334155; }
        h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: 0; }
        p { margin: 0 0 22px; color: #94a3b8; }
        .track { height: 3px; overflow: hidden; border-radius: 2px; background: #1e293b; }
        .bar { width: 42%; height: 100%; background: #22d3ee; animation: loading 1.1s ease-in-out infinite alternate; }
        @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(240%); } }
    </style>
</head>
<body>
    <main>
        <img class="mark" src="app-icon.png" alt="">
        <h1>SubGen</h1>
        <p>Starting the subtitle engine...</p>
        <div class="track"><div class="bar"></div></div>
    </main>
</body>
</html>
